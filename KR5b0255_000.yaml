front:
  text: 天樞院都司須知令
  hash: sha256:81b266976e2e591187f6b9dab11a30028d0c07f832d2325eaa927bc8ac6f9906
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0255_HFL_000-001a, image: hfl/0313/0313-114.png}
body:
  text: 天樞都録係在世活人管提舉簽書録事七人有曹掾七人承受發放七録事管元㑹營兵一萬人名天攝軍承受第一録事司挏提真人沈佺第二録事司茂全真人汪祥第三録事司陽明仙佐傅受第四録事司明救治債真人封休第五録事司手分未有仙職胡注第六録事司手分未有仙職孔又第七録事司手分未有仙職方整七録事掌簽書七十四司公事外祿算司係節員附第一録事司通七十四司簽書七録事亦係在世活人名屬都司隱祕不傳第一録事司名㑹府連祿算司節員共二十七司祿算司玄絳丹霞真人王自記功院掌天下功德輝騰真人盧咸用職治司掌天下法官孜弟休應真人賈益天道院掌天下修行人籍妙德真人吳忱隂績寺掌人隂德隂禍旡為治道真人林黻鬼仙案掌鬼中升仙籍糾察靈真人蕭史兵馬司掌三界兵馬數目自休上元真人歐陽立糧料司掌人物受用數靈輝子華真人歐陽度司命案掌物注而未生符命保功真人傅元枉死案掌人物死罰壽罰算龍光真人白敏中黑獄簿掌仙官罪犯等案風藥莊真人匡休崇真院掌詳定紀功院事黃官真人廖立仙籍院掌諸仙總籍丹霞真人吳致權詳定司掌謄録天下奏牘西華真人吳采奏事局掌通呈奏牘北洞真人王喬年都刑院掌陽間刑獄明分真人臯陶天樞獄掌隂獄諸處天地獄中呈幽闢真人葛洪磨勘司掌四天魔司事八開真人姜惟官廟籍掌祭入典鬼神衮常真人趙奉侯雷雨案掌雷雨仙官符郎野真人蕭莊散仙案掌諸仙出身文籍寶靜真人寶靜檢院仗法駕天仗及仙女治具最先真人傅興差兵案掌三界兵符死亡勝敗虛德真人郭茂先檢察司掌上界判官凊景真人劉真諸天奏院掌諸仙官奏牘文崇治至真人甄善濟諸司案掌奏三島十洲奏牘妙應旡上真人蔡符第二録事司名左八司都局檢察右司掌申下界判官籍杜庭真人江真檢察左司掌五嶽奏牘文字陽華真人梁踈昭文院掌上天門到法律等妙真人裴言刑制院掌犯罪死刑華陽真人馮坦延祚司國祚君王名姓素曠真人崔紀陽官院掌陽界人世官僚清讜真人殷覺隂官院掌隂界地府官僚赫儀真人五竒祗候典掌酆都罪鬼文字瑶康真人黃恱第三録事司名右六司都局義成院掌録天下忠孝人廣明真人仇覽清節院掌録清節之士符㑹真人黃定照臨寺掌四夷人物同條真人歐陽允廣昭寺掌四夷運祚保康真人廖欣日月司掌日月奏牘恭和真人仇香五星院掌諸星文符交光真人士曜第四録事第五録事第六録事第七録事掌四方二十八宿行到事名八司承受七司是正案一司是節員共封為真人同號東方屬第四録事判官八人共封青輝真人王吉秦郎汪覺羊其張毫侯甫牛慶牛度南方屬第五録事判官八人共封赫華真人竇建萬勝封言明鐸茂中封真華間至相西方屬第六録事判官八人共封素寂真人黃文蕭宗關子門胡千胡注黃萬勝劉知幾劉章北方屬第七録事判官八人共封玄靈真人盧吉先郭援王治道李允中李曹洪胡注胡真北樞轉牒使掌送文字付諸司屬都司總管左控鶴使崔隆曹司右馭龍使胡德節員右赤童竇升天樞院都司須知令
